# Manual only: images are published when a human decides to, never on a push.
name: Publish images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (in addition to latest)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: nightwarden
            dockerfile: Dockerfile
          - name: nightwarden-runner
            dockerfile: apps/runner/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Repository names must be lowercase; the account name is not.
      - id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # amd64 is what a DigitalOcean droplet runs; built natively here, so
          # better-sqlite3 and argon2 compile for the right target.
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/${{ matrix.name }}:latest
            ${{ inputs.tag && format('{0}/{1}/{2}:{3}', env.REGISTRY, steps.repo.outputs.owner, matrix.name, inputs.tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
