# Manual only: images are published when a human decides to, never on a push.
name: Publish images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (in addition to latest)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io

jobs:
  # The same gate a pull request faces, so nothing reaches the registry that
  # would have failed review.
  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Attaches a signed record of which commit and workflow built the image.
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - name: nightwarden
            dockerfile: Dockerfile
          - name: nightwarden-runner
            dockerfile: apps/runner/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Repository names must be lowercase; the account name is not.
      - id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # amd64 is what a standard cloud VM runs, built natively here so
          # better-sqlite3 and argon2 compile for the right target. arm64 hosts
          # build locally; the README says so.
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/${{ matrix.name }}:latest
            ${{ inputs.tag && format('{0}/{1}/{2}:{3}', env.REGISTRY, steps.repo.outputs.owner, matrix.name, inputs.tag) || '' }}
          # Scoped per image: on one shared scope the two matrix legs evict each
          # other and neither ends up cached.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
