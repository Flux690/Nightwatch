# Every push to main publishes, so :latest always names what main holds. The
# dispatch entry stays for republishing a commit without pushing a new one.
name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (in addition to latest)"
        required: false
        default: ""

# Never cancels: an interrupted run can leave a manifest pushed with no
# attestation beside it, so a second push queues behind the first instead.
concurrency:
  group: publish-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # The same gate a pull request faces, so nothing reaches the registry that
  # would have failed review.
  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Attaches a signed record of which commit and workflow built the image.
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - name: nightwarden
            dockerfile: Dockerfile
          - name: nightwarden-docker-runner
            dockerfile: apps/docker-runner/Dockerfile
          - name: nightwarden-kubernetes-runner
            dockerfile: apps/kubernetes-runner/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Repository names must be lowercase; the account name is not.
      - id: repo
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # amd64 is what a standard cloud VM runs, built natively here so
          # better-sqlite3 and argon2 compile for the right target. arm64 hosts
          # build locally; the README says so.
          platforms: linux/amd64
          # The commit tag is what keeps the registry free of orphans: :latest is a
          # moving pointer, so without a second tag the digest it leaves behind
          # loses its last one and becomes untagged. With this, every build stays
          # addressable and retention below prunes by age rather than by accident.
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/${{ matrix.name }}:sha-${{ steps.repo.outputs.sha }}
            ${{ inputs.tag && format('{0}/{1}/{2}:{3}', env.REGISTRY, steps.repo.outputs.owner, matrix.name, inputs.tag) || '' }}
          # Scoped per image: on one shared scope the two matrix legs evict each
          # other and neither ends up cached.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # The attest step below already records provenance. BuildKit's own
          # would be a second copy, published as an extra manifest per image.
          provenance: false

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Publishing on every push makes history unbounded, so it is bounded here.
      # Three versions per build, not one: the image, the provenance attestation,
      # and the index tagged sha256-<image digest> that links them. Thirty is ten
      # builds; counting it in builds would silently keep three.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.name }}
          package-type: container
          min-versions-to-keep: 30
