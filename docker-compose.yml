services:
  nightwarden:
    image: ghcr.io/prabhatmattoo/nightwarden:latest
    # Or build locally: docker compose build
    build: .
    restart: unless-stopped
    # Docker Desktop provides this name; Linux does not, and without it a
    # Prometheus or Loki on this same host is unreachable from in here.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Must be routable from runners and Alertmanager, not just your browser.
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL, e.g. http://203.0.113.10:3000}
      # One variable for all three references so the paths cannot drift.
      NIGHTWARDEN_DIR: ${NIGHTWARDEN_DIR:-/opt/nightwarden}
      # Optional first-boot seed; otherwise pick the provider in the console.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      # Evidence sources, on the same first-boot terms. Probed before they save,
      # and Prometheus is seeded as its own rules endpoint, which is what lets an
      # investigation opened by its alerts ever reach Resolved.
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      PROMETHEUS_AUTH_HEADER: ${PROMETHEUS_AUTH_HEADER:-}
      LOKI_URL: ${LOKI_URL:-}
      LOKI_AUTH_HEADER: ${LOKI_AUTH_HEADER:-}
      LOKI_ORG_ID: ${LOKI_ORG_ID:-}
      # Unset means a key file is generated in NIGHTWARDEN_DIR and reused; set it
      # to manage the value yourself. Changing it makes stored credentials
      # unreadable and signs every owner session out.
      SECRET_KEY: ${SECRET_KEY:-}
      # Override to pin a tag or serve the runners from a private registry.
      NIGHTWARDEN_DOCKER_RUNNER_IMAGE: ${NIGHTWARDEN_DOCKER_RUNNER_IMAGE:-}
      NIGHTWARDEN_KUBERNETES_RUNNER_IMAGE: ${NIGHTWARDEN_KUBERNETES_RUNNER_IMAGE:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Same path inside and out, never a named volume: the host daemon resolves
      # sandbox mounts against the host, so a container-only path mounts empty.
      - ${NIGHTWARDEN_DIR:-/opt/nightwarden}:${NIGHTWARDEN_DIR:-/opt/nightwarden}
      # Sandboxes and the egress proxy are sibling containers started here.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
